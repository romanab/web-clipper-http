name: CI

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository and upstream submodule
        uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            upstream/obsidian-clipper/package-lock.json

      - name: Install project dependencies
        run: npm ci

      - name: Install pinned upstream dependencies
        run: npm --prefix upstream/obsidian-clipper ci

      - name: Verify compatibility and tests
        run: npm run verify

      - name: Build and package extension
        run: npm run package

      - name: Upload extension ZIP
        uses: actions/upload-artifact@v4
        with:
          name: web-clipper-http
          path: releases/*.zip
          if-no-files-found: error
