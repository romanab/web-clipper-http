<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>Web Clipper HTTP</title></head>
<body>
  <main>
    <h1>Web Clipper HTTP</h1>
    <h2>HTTP destination</h2>
    <form id="config-form">
      <p><label>Endpoint URL<br><input id="endpoint" type="url" required placeholder="https://example.com/api/clips"></label></p>
      <p><label>Bearer token<br><input id="token" type="password" autocomplete="off"></label></p>
      <button type="submit">Save destination</button> <span id="status" role="status"></span>
    </form>

    <h2>Templates</h2>
    <p>Templates use the Obsidian Web Clipper template JSON shape.</p>
    <p><input id="template-file" type="file" accept="application/json,.json"> <button id="import-templates" type="button">Import JSON</button></p>
    <p><button id="export-templates" type="button">Export JSON</button></p>
    <ul id="template-list"></ul>
    <p id="template-status" role="status"></p>
  </main>
  <script type="module" src="options.js"></script>
</body>
</html>
